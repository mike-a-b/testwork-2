<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача 4</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        #buttonContainer {
            display: flex;
            flex-direction: column; /* Располагаем элементы друг под другом */
            align-items: flex-start; /* Выравниваем кнопки по левому краю */
        }

        .btn {
            margin-bottom: 5px; /* Небольшой отступ между кнопками */
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #f0f0f0;
            border-radius: 5px;
            width: 50px; /* Фиксированная ширина для единообразия */
            text-align: center;
        }
    </style>
</head>
<body>

<div id="buttonContainer">
    <button class="btn">1</button>
    <button class="btn">2</button>
    <button class="btn">3</button>
</div>

<script>
    $(document).ready(function() {
        // Отслеживаем текущее состояние порядка кнопок (0, 1, 2)
        // 0: 1-2-3
        // 1: 2-3-1
        // 2: 3-2-1
        let currentState = 0;

        // Обработчик клика для любой кнопки внутри контейнера
        $('#buttonContainer').on('click', '.btn', function() {
            // Увеличиваем состояние и сбрасываем на 0 после 2 (3 состояния всего)
            currentState = (currentState + 1) % 3;

            const container = $('#buttonContainer');
            // Получаем ссылки на кнопки по их текущему содержимому (тексту)
            // Это предполает, что текст кнопок уникален и не меняется
            const btn1 = container.find('button:contains("1")');
            const btn2 = container.find('button:contains("2")');
            const btn3 = container.find('button:contains("3")');

            // Очищаем контейнер от текущих кнопок
            container.empty();

            // Вставляем кнопки обратно в контейнер в зависимости от нового состояния
            if (currentState === 0) {
                // Порядок 1-2-3
                container.append(btn1, btn2, btn3);
            } else if (currentState === 1) {
                // Порядок 2-3-1
                container.append(btn2, btn3, btn1);
            } else if (currentState === 2) {
                // Порядок 3-2-1
                container.append(btn3, btn2, btn1);
            }
        });
    });
</script>
</body>
</html>
